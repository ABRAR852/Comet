spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  application:
    name: comet
  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          options:
            model: gemini-3.5-flash-lite
            thinking-level: MEDIUM
  mcp:
    server:
      name: comet-tools-server
      version: 1.0.0
      protocol: STREAMABLE
      type: SYNC
logging:
  level:
    org.springframework.ai.chat.client.advisor.SimpleLoggerAdvisor: DEBUG
openserp:
  base-url: ${OPENSERP_URL:http://127.0.0.1:7000}
  auth-enabled: ${OPENSERP_AUTH_ENABLED:false}
